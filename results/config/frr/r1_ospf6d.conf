hostname r1-ospf6d
log file /var/log/frr/r1-ospf6d.log
router ospf6
 ospf6 router-id 1.1.1.1
exit
interface to2
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 hello-interval 1
 ipv6 ospf6 dead-interval 3
exit
interface to3
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 hello-interval 1
 ipv6 ospf6 dead-interval 3
exit
interface toh1
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 passive
exit
