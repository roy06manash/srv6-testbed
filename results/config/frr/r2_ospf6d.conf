hostname r2-ospf6d
log file /var/log/frr/r2-ospf6d.log
router ospf6
 ospf6 router-id 2.2.2.2
exit
interface to1
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 hello-interval 1
 ipv6 ospf6 dead-interval 3
exit
interface to5
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 hello-interval 1
 ipv6 ospf6 dead-interval 3
exit
