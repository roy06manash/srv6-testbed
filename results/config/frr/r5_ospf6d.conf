hostname r5-ospf6d
log file /var/log/frr/r5-ospf6d.log
router ospf6
 ospf6 router-id 5.5.5.5
exit
interface to2
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 hello-interval 1
 ipv6 ospf6 dead-interval 3
exit
interface to4
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 hello-interval 1
 ipv6 ospf6 dead-interval 3
exit
interface toh2
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 passive
exit
